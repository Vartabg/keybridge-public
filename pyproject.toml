[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keybridge-local"
version = "0.1.0"
description = "Bounded local API access for coding agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
keybridge = "keybridge.cli:main"

[tool.setuptools.packages.find]
include = ["keybridge*"]
